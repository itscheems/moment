name: merge-result-audit

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged pull request number to audit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  merge-result-audit:
    name: merge-result-audit
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Audit recorded merge result
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node scripts/dev/check-merge-policy.mjs audit --pr "$PR_NUMBER"
          else
            node scripts/dev/check-merge-policy.mjs audit
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
