name: merge-policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-policy:
    name: merge-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: node --test scripts/dev/check-merge-policy.test.mjs
      - run: node scripts/dev/check-merge-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
