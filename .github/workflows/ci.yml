name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Web build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: node pnpm
          cache: true
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web format:check
      - run: pnpm --dir web lint
      - run: pnpm --dir web build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-assets
          path: internal/webassets/dist
          retention-days: 1
          if-no-files-found: error

  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: node pnpm
          cache: true
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test

  go:
    name: Go ${{ matrix.group }}
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [core, archive, lifecycle]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: ${{ matrix.group == 'core' && 'go node task golangci-lint' || 'go node' }}
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-assets
          path: internal/webassets/dist
      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: ${{ runner.os }}-go-${{ hashFiles('.mise.toml') }}-${{ matrix.group }}-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('.mise.toml') }}-${{ matrix.group }}-
      - name: Go formatting and tooling tests
        if: matrix.group == 'core'
        run: |
          node scripts/dev/check-go-format.mjs
          node --test scripts/dev/check-go-format.test.mjs scripts/dev/layout-probe.test.mjs scripts/dev/check-merge-policy.test.mjs
      - name: Go vet
        if: matrix.group == 'core'
        run: go vet ./...
      - name: Go lint
        if: matrix.group == 'core'
        run: golangci-lint run
      - name: Go race tests
        run: node scripts/dev/test-go-group.mjs "${{ matrix.group }}"
      - name: Process lock tests
        if: matrix.group == 'core'
        run: task lock:test
      - name: Build native binary
        if: matrix.group == 'core'
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -o dist/moment ./cmd/moment

  security:
    name: dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: go node pnpm task gitleaks
          cache: true
      - run: task setup
      - run: task security:source
