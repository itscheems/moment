name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    name: ${{ matrix.os }} native and process locks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: task setup
      - run: task ci
      - name: Real cross-process shared, exclusive, and crash-release locks
        run: task lock:test

  full-scale:
    name: full 20 GiB qualification
    runs-on: [self-hosted, linux, x64, moment-release-scale]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: task setup
      - name: Build tagged artifacts from the qualification commit
        run: |
          bash scripts/release/assert-clean-tree.sh
          bash scripts/release/goreleaser-build.sh --clean --skip=publish
          bash scripts/release/finalize-artifacts.sh
      - run: MOMENT_EXPECTED_VERSION="${GITHUB_REF_NAME#v}" task release:artifacts
      - run: bash scripts/release/performance-full.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            dist/release-evidence.json
            dist/performance-evidence.json
          if-no-files-found: error

  native-artifacts:
    name: ${{ matrix.os }} qualified native archive
    needs: full-scale
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-release
          path: dist
      - run: task setup
      - run: pnpm --dir web build
      - name: Checksum, extract, and execute the qualified native archive
        run: node scripts/release/native-artifact-smoke.mjs
        env:
          MOMENT_RELEASE_TAG: ${{ github.ref_name }}

  preflight:
    name: security, reproducibility, and container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: task setup
      - run: task release:preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-qualification
          path: |
            dist/container.spdx.json
            dist/container-evidence.json
          if-no-files-found: error

  publish:
    name: package and publish
    needs: [platform, full-scale, native-artifacts, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-release
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: container-qualification
          path: dist
      - run: task setup
      - name: Reverify the qualified artifacts without rebuilding
        run: MOMENT_EXPECTED_VERSION="${GITHUB_REF_NAME#v}" MOMENT_REQUIRE_QUALIFICATION=1 MOMENT_VERIFY_ONLY=1 task release:artifacts
      - name: Publish authenticated repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/*.zip dist/*.sbom.json dist/checksums.txt
          dist/release-evidence.json dist/performance-evidence.json
          dist/container.spdx.json dist/container-evidence.json
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
