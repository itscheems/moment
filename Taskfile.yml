version: "3"

tasks:
  setup:
    desc: Install the locked Web dependencies
    cmds:
      - pnpm --dir web install --frozen-lockfile

  run:
    desc: Build the Web bundle and run Moment
    deps: [web:build]
    cmds:
      - go run ./cmd/moment {{.CLI_ARGS}}

  fmt:
    desc: Format Go and Web sources
    cmds:
      - go fmt ./...
      - pnpm --dir web format

  fmt:check:
    desc: Check formatting without changing tracked sources
    cmds:
      - go fmt ./...
      - git diff --exit-code -- "*.go"
      - pnpm --dir web format:check

  lint:
    desc: Run static checks for Go and Web
    deps: [web:build]
    cmds:
      - go vet ./...
      - golangci-lint run
      - pnpm --dir web lint
      - pnpm --dir web typecheck

  test:
    desc: Run Go race tests and Web tests
    deps: [web:build]
    cmds:
      - go test -race ./...
      - pnpm --dir web test

  build:
    desc: Build one CGo-free Moment binary with embedded Web assets
    deps: [web:build]
    env:
      CGO_ENABLED: "0"
    cmds:
      - node -e "require('node:fs').mkdirSync('dist', {recursive:true})"
      - go build -buildvcs=false -trimpath -o dist/moment{{exeExt}} ./cmd/moment

  ci:
    desc: Run the complete local CI gate
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
      - task: build

  lock:test:
    desc: Prove real cross-process lock behavior on the host OS
    cmds:
      - go test -count=1 -v ./internal/runtimefs -run '^(TestCrossProcessSharedExclusiveAndCrashRelease|TestLockOrderIsRejectedAcrossProcessBoundary)$'

  security:
    desc: Run source, dependency, license, and adversarial security gates
    deps: [web:build]
    cmds:
      - bash scripts/release/check-vulnerabilities.sh
      - pnpm --dir web audit --registry=https://registry.npmjs.org --audit-level high
      - gitleaks git --redact --no-banner --no-color .
      - bash scripts/release/check-licenses.sh
      - go test -race ./internal/domain ./internal/media ./internal/archive ./internal/auth ./internal/observability ./internal/transport/http/gin

  release:cross-build:
    desc: Cross-build every supported CGo-free target
    deps: [web:build]
    cmds:
      - bash scripts/release/cross-build.sh

  release:snapshot:
    desc: Build the complete local GoReleaser snapshot with checksums and SBOMs
    cmds:
      - bash scripts/release/assert-clean-tree.sh
      - goreleaser check
      - bash scripts/release/goreleaser-build.sh --snapshot --clean --skip=publish
      - bash scripts/release/finalize-artifacts.sh

  release:reproducible:
    desc: Build the same snapshot twice and require byte-identical release archives
    cmds:
      - bash scripts/release/reproducible-snapshot.sh

  release:artifacts:
    desc: Verify release archive contents, checksums, metadata, and embedded runtime assets
    cmds:
      - bash scripts/release/verify-artifacts.sh
      - bash scripts/release/verify-version-rejection.sh

  release:container:
    desc: Verify the non-root container lifecycle and persistent data volume
    cmds:
      - bash scripts/release/container-smoke.sh

  release:performance:full:
    desc: Run the real 20 GiB qualification fixture and declared latency gates
    deps: [web:build, release:reproducible]
    env:
      MOMENT_RUN_DEV_SCALE: "1"
    cmds:
      - task: release:artifacts
      - bash scripts/release/performance-full.sh

  release:preflight:
    desc: Run fast release gates before the dedicated 20 GiB qualification
    cmds:
      - task: ci
      - task: lock:test
      - task: security
      - task: release:cross-build
      - task: release:reproducible
      - task: release:artifacts
      - task: release:container

  release:qualification:
    desc: Run the complete release gate including the real 20 GiB fixture
    cmds:
      - task: release:preflight
      - task: release:performance:full

  web:build:
    internal: true
    sources:
      - web/src/**/*
      - web/public/**/*
      - web/index.html
      - web/package.json
      - web/pnpm-lock.yaml
      - web/tsconfig*.json
      - web/vite.config.ts
    generates:
      - internal/webassets/dist/**/*
    cmds:
      - pnpm --dir web build
