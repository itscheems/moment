version: 2

project_name: moment

before:
  hooks:
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build

builds:
  - id: moment
    main: ./cmd/moment
    binary: moment
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - >-
        -s -w
        -X github.com/moment/moment/internal/buildinfo.Version={{.Version}}
        -X github.com/moment/moment/internal/buildinfo.Commit={{.Commit}}
        -X github.com/moment/moment/internal/buildinfo.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: git
